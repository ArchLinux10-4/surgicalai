[pytest]
# Only backend/tests. Pytest's default walk also picks up
# services/test_preview_bundle.py (a script that exits on import) and
# services/tests/test_pr72.py (it reads pipeline_pr72.py, which is not in the repo).
testpaths = tests/test_prose_flushed_before_tool.py tests/test_prompt_snapshots.py tests/test_qa_after_diff.py
addopts = -m "not browser"
markers =
    browser: launches a real Chromium and sleeps; run with pytest -m browser
    slow: allowed to run longer than the default per-test limit
