<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>SurgicalAI — Precision Code Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <style>
      /* Emergency fallback — Tailwind handles everything else */
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; }
      kbd { font-family: monospace; }

      /* Prevent any element from pushing the page wider than the viewport.
         This stops the browser auto-zooming out on mobile when a code block
         or diff line overflows. overflow-x:hidden on html+body is the
         standard cross-browser fix for this. */
      html, body, #root {
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* Code / pre blocks inside mobile diff cards must scroll horizontally
         rather than stretching the page width. */
      pre { overflow-x: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
