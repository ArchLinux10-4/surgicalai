<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>SurgicalAI — Precision Code Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SurgicalAI" />
    <style>
      /* Emergency fallback — Tailwind handles everything else */
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; }
      kbd { font-family: monospace; }

      /* Prevent any element from pushing the page wider than the viewport.
         This stops the browser auto-zooming out on mobile when a code block
         or diff line overflows. overflow-x:hidden on html+body is the
         standard cross-browser fix for this. */
      html, body, #root {
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* Code / pre blocks inside mobile diff cards must scroll horizontally
         rather than stretching the page width. */
      pre { overflow-x: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
